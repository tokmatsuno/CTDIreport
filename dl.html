<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>パンフレットダウンロード｜教育と探求社</title>
<style>
  :root { --brand: #1a4d8f; --bg: #f6f8fa; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
         background: var(--bg); color: #222; line-height: 1.7; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 1.4rem; color: var(--brand); margin-bottom: 8px; }
  .lead { font-size: .95rem; color: #555; margin-bottom: 24px; }
  .notice { background: #fff8e1; border: 1px solid #e6c96b; border-radius: 8px;
            padding: 12px 16px; font-size: .9rem; margin-bottom: 24px; display: none; }
  .card { background: #fff; border: 1px solid #e0e4e8; border-radius: 10px;
          padding: 20px; margin-bottom: 16px; display: flex;
          justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; }
  .card h2 { font-size: 1.05rem; }
  .card p { font-size: .85rem; color: #666; }
  .btn { display: inline-block; background: var(--brand); color: #fff;
         text-decoration: none; padding: 10px 22px; border-radius: 6px;
         font-size: .95rem; white-space: nowrap; }
  .btn:hover { opacity: .85; }
  footer { margin-top: 40px; font-size: .8rem; color: #888; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <h1>パンフレットダウンロード</h1>
  <p class="lead">このたびは資料をご請求いただきありがとうございます。<br>
  ご希望のパンフレットを以下よりダウンロードいただけます。</p>

  <div id="list"></div>

  <footer>© 教育と探求社</footer>
</div>

<script>
/* ============================================================
   パンフレット一覧（12種）
   label : Kairos3フォームの選択肢名と一字一句一致させること
   ※フォーム側の選択肢名を変更したら、必ずこのlabelも同時に更新
   ============================================================ */
const PAMPHLETS = [
  { label: "総合パンフレット", name: "総合パンフレット", desc: "", url: "https://info.eduq.jp/storage/QuestEducation_pamphlet.pdf" },
  { label: "コーポレートアクセス", name: "コーポレートアクセス", desc: "", url: "https://info.eduq.jp/storage/QuestEducation_CorporateAccess.pdf" },
  { label: "マイクエスチョン", name: "マイクエスチョン", desc: "", url: "https://info.eduq.jp/storage/QuestEducation_MYQUESTION.pdf" },
  { label: "マイクエスチョンアドバンス", name: "マイクエスチョンアドバンス", desc: "", url: "https://info.eduq.jp/storage/QuestEducation_MYQUESTIONAdvance.pdf" },
  { label: "ソーシャルチェンジ", name: "ソーシャルチェンジ", desc: "", url: "https://info.eduq.jp/storage/QuestEducation_SocialChange.pdf" },
  { label: "ソーシャルチェンジイングリッシュ", name: "ソーシャルチェンジイングリッシュ", desc: "", url: "https://info.eduq.jp/storage/QuestEducation_SocialChangeEnglish.pdf" },
  { label: "マイパーパス", name: "マイパーパス", desc: "", url: "https://info.eduq.jp/storage/QuestEducation_MyPurpose.pdf" },
  { label: "スモールスタート", name: "スモールスタート", desc: "", url: "https://info.eduq.jp/storage/QuestEducation_SmallStart.pdf" },
  { label: "ロールモデル", name: "ロールモデル", desc: "", url: "https://info.eduq.jp/storage/QuestEducation_RoleModel.pdf" },
  { label: "インターン", name: "インターン", desc: "", url: "https://info.eduq.jp/storage/QuestEducation_Intern.pdf" },
  { label: "マイストーリー", name: "マイストーリー", desc: "", url: "https://info.eduq.jp/storage/QuestEducation_MyStory.pdf" },
  { label: "ザ・ビジョン", name: "ザ・ビジョン", desc: "", url: "https://info.eduq.jp/storage/QuestEducation_TheVision.pdf" }
];

/* ============================================================
   ロジック：URLの ?items= に含まれる資料名で照合して表示

   1. カンマ（, ／ 、）区切りで分割し、空白を除去
   2. labelと【完全一致】で照合
      ※部分一致は使わない：「ソーシャルチェンジ」と
      「ソーシャルチェンジイングリッシュ」のように名前が
      包含関係にあるペアが誤表示されるため
   3. 1件も一致しない場合は全件表示（フォールバック）
   ============================================================ */
(function () {
  const normalize = s => s.replace(/[\s　]+/g, "").trim();

  let selected = [];
  try {
    const raw = new URLSearchParams(location.search).get("items") || "";
    const tokens = decodeURIComponent(raw)
      .split(/[,、]/)
      .map(t => normalize(t))
      .filter(t => t.length > 0);

    if (tokens.length > 0) {
      selected = PAMPHLETS.filter(p => tokens.includes(normalize(p.label)));
    }
  } catch (e) { selected = []; }

  /* 固定URL運用：通常は全件表示。?items= で一致があれば絞り込み表示も可能 */
  const items = selected.length > 0 ? selected : PAMPHLETS;
  document.getElementById("list").innerHTML = items.map(p => `
    <div class="card">
      <div>
        <h2>${p.name}</h2>
        ${p.desc ? `<p>${p.desc}</p>` : ""}
      </div>
      <a class="btn" href="${p.url}" target="_blank" rel="noopener">ダウンロード（PDF）</a>
    </div>`).join("");
})();
</script>
</body>
</html>
